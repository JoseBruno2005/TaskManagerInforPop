<h2 class="text-2xl font-semibold mb-4">Login</h2>

<form
  (ngSubmit)="submit(form.value)"
  #form="ngForm"
  class="max-w-md mx-auto bg-white p-6 rounded-lg shadow space-y-4"
>
  <input 
    name="email" 
    ngModel 
    required 
    placeholder="Email" 
    class="w-full border rounded px-3 py-2 focus:outline-none focus:ring focus:ring-blue-400" 
  />

  <input
    type="password"
    name="password"
    ngModel
    required
    placeholder="Senha"
    class="w-full border rounded px-3 py-2 focus:outline-none focus:ring focus:ring-blue-400"
  />

  <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded">Entrar</button>

  @if (errorMessage) {
    <p class="text-red-500">
      {{ errorMessage }}
    </p>
  }
</form>

<div class="flex flex-row items-center justify-between px-6 py-4 bg-white border-b border-slate-200 sticky top-0 z-50">
  <div class="flex items-center gap-6">
    <button (click)="goToHome()" class="text-xl font-black text-slate-900 tracking-tight hover:text-indigo-600 transition-colors">
      InforPop<span class="text-indigo-600">Tasks</span>
    </button>
    
    <div class="hidden sm:block">
      @if (user()) {
        <div class="flex flex-col border-l border-slate-200 pl-6">
          <span class="text-[10px] uppercase font-bold text-slate-400 tracking-widest">Usuário Ativo</span>
          <span class="text-sm font-semibold text-slate-700 italic">Olá, {{ user()!.name }}</span>
        </div>
      }
    </div>
  </div>

  <div>
    <button class="bg-rose-500 hover:bg-rose-600 text-white px-5 py-2 rounded-lg text-sm font-bold transition-all shadow-sm active:scale-95" (click)="handleLogout()">
      Sair
    </button>
  </div>
</div>

<label *ngIf="label" class="mb-1 block text-sm font-medium text-gray-700">
  {{ label }}
</label>

<input
  [type]="type"
  [value]="value"
  [placeholder]="placeholder"
  [disabled]="disabled"
  (input)="handleInput($event)"
  (blur)="onTouched()"
  class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 disabled:bg-gray-100 disabled:cursor-not-allowed"
/>
